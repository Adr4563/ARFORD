# Parámetros ROS2 equivalentes a las variables de entorno del proyecto
# original (deploy-raspberry-standalone/README.md, sección "Subir a un
# modelo más grande" / "Carrito mecanum" / "Escribirle a Romeo..."). Se
# pueden sobreescribir por línea de comando al lanzar
# (`ros2 launch romeo_bringup romeo_bringup.launch.py mic_activo:=false`) sin
# editar este archivo -- ver launch/romeo_bringup.launch.py.

communication_node:
  ros__parameters:
    # --- Voz de salida (altavoz de la placa ESP32-S3) ---
    voz_motor: "vits"              # vits | piper
    voz_piper_modelo: ""           # solo con voz_motor: piper. Vacío = ~/piper-voces/es_CO-dii.onnx
    # LA VOZ DE ROMEO: es_MX-claude-high, español de México (modelo Piper
    # cargado con sherpa-onnx).
    #
    # Los ajustes de abajo son los NATIVOS del modelo. Antes estaban en
    # 0.33 / 0.5 / 1.15, elegidos de oído para la voz anterior, que
    # susurraba y necesitaba menos "aire" y un ritmo forzado. Esta voz no
    # tiene ese problema, y con aquellos valores sonaba apagada y lenta:
    # son los mismos números con los que se probó en la PC antes de
    # elegirla.
    #
    # OJO si se añade otra voz descargada de HuggingFace: hay que
    # inyectarle sample_rate en los metadatos del .onnx y pasar el
    # tokens.txt a saltos de línea Unix, o sherpa-onnx no la carga.
    voz_vits_dir: "/home/pi/.romeo/modelos/vits-piper-es_MX-claude-high"
    voz_vits_ruido: 0.667          # nativo de Piper
    voz_vits_ruido_w: 0.8          # nativo de Piper
    voz_vits_duracion: 1.0         # velocidad natural, sin ralentizar
    voz_tono_semitonos: 0.0        # sin semitonos (tono natural)
    # Volumen con el que mpv reproduce la voz (0-100, 100 = sin atenuar).
    # Bajo a propósito: el parlante de la placa distorsiona y pide
    # demasiada corriente con el volumen alto. Por debajo va además el
    # mezclador ALSA del códec ES8311, que NO se controla desde acá -- ver
    # scripts/volumen_placa.sh.
    voz_volumen: 80

    # --- Salida de audio: el parlante de la placa ESP32-S3 ---
    # La placa es una tarjeta de sonido USB. OJO con el nombre: es "Board"
    # (de "Lora Audio Board"), el que reporta la placa YA FLASHEADA -- ver
    # la nota de mic_dispositivo más abajo. Vacío = salida por defecto.
    audio_salida: "alsa/plughw:CARD=Board,DEV=0"
    # La placa solo acepta 16 kHz: se le fuerza el remuestreo a mpv, que lo
    # hace con filtro de calidad. Si lo hace el `plughw` de ALSA (lineal,
    # sin filtro) la voz suena metálica. 0 = no forzar.
    audio_muestreo: 16000
    # Volumen de la música (0-100). Igualado a voz_volumen: con 25 la música
    # sonaba a menos de la mitad que la voz y no se oía, porque además se
    # multiplica por el mezclador del códec (ver volumen_placa.sh).
    #
    # El 25 venía de que con la música fuerte la placa pedía demasiada
    # corriente y se desconectaba. Si vuelve a pasar -- se ve como
    # "USB disconnect" en dmesg -- hay que bajarlo de nuevo.
    musica_volumen: 80

    # --- Voz de entrada (micrófono de la placa ESP32-S3, STT local) ---
    # El bug de los ceros ya está resuelto (mapeo DIN=15/DOUT=16, ver
    # firmware-audio-board/README.md): el micrófono entrega señal real, pero
    # baja (RMS ~45 en silencio de sala), que es lo que el STT normaliza.
    # Poner mic_activo: false para trabajar solo con el teclado.
    mic_activo: true
    # Subcadena del nombre del dispositivo de captura, tal como lo lista
    # sounddevice. Tiene que coincidir con UNO SOLO o sounddevice lanza
    # "Multiple input devices found" y el micrófono no arranca.
    #
    # Por eso NO vale "Lora" ni "Lora Audio Board": con pipewire corriendo,
    # la misma placa aparece 3 veces (el dispositivo ALSA + dos nodos de
    # PulseAudio cuyo nombre también lleva "Lora_Audio_Board").
    #
    # Tampoco vale "Board: USB Audio": ese es el nombre del dispositivo ALSA
    # crudo, y cuando pipewire toma la tarjeta deja de listarlo -- entonces
    # no coincide con NADA y el micrófono se cierra sin transcribir (el aviso
    # de _stt_engine.py sale por stdout, no al log de ROS, así que no se ve).
    # "alsa_input.usb-Lora" coincide solo con la entrada de pipewire; el otro
    # nodo con "Lora" en el nombre es el .monitor, que graba el altavoz.
    #
    # Tampoco se usa "hw:3,0": el número de tarjeta cambia entre arranques
    # (se ha visto como card 1 y como card 3).
    mic_dispositivo: "Board: USB Audio"
    # Motor de STT. Medido en la Pi con voz real por el microfono de la placa
    # (10 s de audio, la voz llega al 6-7% de la escala):
    #
    #   nemo    2.2 s  -- FastConformer transducer, SOLO espanol. El mejor:
    #                     acierta el nombre, "espero" y "consciente".
    #   whisper 8.6 s  -- con tam=base. Se come el nombre ("Ya madre") y el
    #                     final. Con tam=tiny se queda en bucle.
    #                     Con tam=small acierta mas, pero tarda 30 s.
    #
    # whisper queda como alternativa por ser multilingue; nemo solo espanol.
    stt_motor: "whisper"           # nemo | whisper
    stt_tam: "small"               # solo con stt_motor: whisper
    # 3 es el optimo medido con whisper-small en la Pi (4 nucleos), sobre 5 s
    # de audio: 2 hilos 9.9 s, 3 hilos 8.0 s, 4 hilos 12.5 s -- con 4 compite
    # con los otros nodos y empeora. El "2" de antes se midio con whisper-tiny,
    # que es 10x mas pequeño.
    stt_hilos: 3

moving_control_node:
  ros__parameters:
    carrito_port: "/dev/ttyACM0"
    # Página para mover el carrito a mano desde el celular o la PC:
    # http://<ip-de-la-pi>:8080/  -- 0 la desactiva.
    control_web_port: 8080

# orchestrator_node no declara parámetros propios -- los modelos de Ollama
# siguen siendo variables de entorno (ver launch/romeo_bringup.launch.py).
